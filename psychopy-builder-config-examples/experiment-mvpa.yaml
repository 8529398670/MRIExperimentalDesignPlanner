# PsychoPy task configuration - generated by the fMRI Experimental Design Planner.
# Study:     Dense Single-Participant fMRI Decoding of Prompted Binary Inner Speech
# Aim:       Aim 2 - MVPA (estimation)
# Protocol:  fMRI-MVPA-Parameters, TR 1000 ms
# Generated: 2026-08-24 23:59
#
# One run of this file is 30 trials, 13.5 - 19.5 min.
# The plan calls for 3 runs per session across 3 sessions, 270 trials in total.
# The scanner, run, trial and conditions blocks are filled in from the solved
# design. Everything else is the lab template, unchanged.

experiment: inner_speech_v2_mvpa

paths:
  data_dir: data                 # the common JSON database lives here
  bank: questions/bank.json
  images_dir: questions/images

window:
  size: [1280, 800]
  fullscreen: true
  screen: 0
  color: [-1, -1, -1]            # PsychoPy rgb, -1..1  (black)
  units: height
  mouse_visible: false

text:
  font: Arial
  height: 0.06
  wrap_width: 1.3
  color: [1, 1, 1]
  title_pos: [0, 0.30]           # where views that also show graphics put the text

fixation:
  text: "+"
  height: 0.08
  color: [1, 1, 1]

cue:
  height: 0.12
  color: [1, 1, 1]

scanner:
  tr: 1.0                        # fMRI-MVPA-Parameters
  trigger_key: "5"
  wait_for_triggers: 12          # dummy volumes; t=0 is the LAST of these pulses
  log_triggers: true             # every pulse is written to the database

run:
  lead_in: 12.0
  lead_out: 12.0
  n_blocks: 3
  trials_per_block: 10           # -> 30 trials/run
  inter_block_rest: 12.0         # rest between blocks, inside the run
  inter_trial_gap: 0.0           # dead time between successive trials
  label_order: intermixed        # how yes and no answers are sequenced
  label_run_length: 1            # same-label run length (blocked ordering only)
  label_balance_pct: 50          # share of primary trials whose answer is yes

trial:
  round_jitter_to_tr: true       # uniform / exponential only; geometric is always whole TRs
  jitter: geometric              # uniform | exponential | geometric, for every [lo, hi] phase
  jitter_p: 0.5                  # geometric: chance the event comes on the next TR
  phases:
    - {name: fixation_pre,  show: fixation, dur: [2.0, 6.0]}
    - {name: question,      show: question, dur: 4.0}
    - {name: rest,          show: blank,    dur: [6.0, 10.0]}
    # - {name: answer_cue,    show: cue,      dur: 3.0}
    - {name: fixation_post, show: fixation, dur: [10.0, 14.0]}

# Trial conditions. `per_run` must sum to n_blocks * trials_per_block (30).
# The control share is the question bank's embedded control-trial share (15%),
# split as evenly as the count allows across the four control conditions.
# response = the token the participant actually repeats during the answer window.
#   answer   -> the true answer          none  -> stay silent
#   opposite -> the inverted answer      ready -> the constant word "ready"
# cue_from_response: the cue displays the token itself (used for cue-only trials).
conditions:
  primary:       {per_run: 25, cue: "●", show_question: true,  response: answer}
  passive_read:  {per_run: 2,  cue: "○", show_question: true,  response: none}
  cue_only:      {per_run: 1,  cue: "◆", show_question: false, response: answer, cue_from_response: true}
  constant_word: {per_run: 1,  cue: "▲", show_question: true,  response: ready}
  opposite:      {per_run: 1,  cue: "✖", show_question: true,  response: opposite}

console:                         # operator readout in the terminal
  refresh_hz: 10                 # live redraw rate; 0 for one plain line per trial
  colour: true

keys:
  quit: ["escape"]
  advance: ["space"]

instructions: |
  When the answer cue appears, silently repeat the correct answer - yes or no -
  throughout the entire 3-second window at a steady, comfortable cadence.

  Keep your jaw, tongue, and lips still.
  When the cue disappears, stop repeating the word and return to fixation.

  Press SPACE when you are ready.
