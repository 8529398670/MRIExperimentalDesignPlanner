# Every setting the task reads, with its default.
#
# Each config in config/ (and every config mirrored from the planner) is merged
# over this file, so a config only needs the keys it changes. Mappings merge key
# by key; a list, a scalar, and the whole `conditions` block replace what is
# here. `~` marks a key every config must set. The run record keeps the merged
# result, so it always says exactly what ran.
#
# This file is not a config of its own: it is never listed, drawn or demoed.

experiment: ~                    # required: the design's name, written to every run record

paths:                           # resolved against the project directory
  data_dir: data                 # the common JSON database lives here
  bank: questions/bank.json
  images_dir: questions/images
  run_id: "sub-{participant}_ses-{session:02d}_run-{run:02d}"   # names data/runs/<run_id>.json

window:
  size: [1280, 800]
  fullscreen: true
  screen: 0
  color: [-1, -1, -1]            # PsychoPy rgb, -1..1  (black)
  units: height
  mouse_visible: false
  allow_gui: false               # window decorations
  wait_blanking: true            # flip on the vertical blank
  assumed_refresh_hz: 60         # frame rate to assume when PsychoPy cannot measure it

text:                            # every piece of text; screens and messages start from these
  font: Arial
  height: 0.06
  wrap_width: 1.3
  color: [1, 1, 1]
  align: center                  # center | left | right
  title_pos: [0, 0.30]           # where views that also show graphics put the text

fixation:                        # the `fixation` screen
  text: "+"
  height: 0.08
  color: [1, 1, 1]

# More screens a phase (or the lead-in / lead-out) can `show`, besides fixation,
# question, cue and blank. Each is a line of text; unset fields come from `text:`.
#   screens:
#     rest: {text: "·", height: 0.05, color: [0.5, 0.5, 0.5], pos: [0, 0]}
screens: {}

cue:
  height: 0.12
  color: [1, 1, 1]
  pos: [0, 0]
  token_case: upper              # how a cue_from_response cue writes the token: upper | lower | as_is

views:                           # the question renderers (see questions/bank.json `view`)
  text:
    pos: [0, 0]                  # the question text, when it is all there is
  image:
    pos: [0, -0.05]              # the picture; the text goes to text.title_pos
  shapes:
    max_shapes: 6                # shapes drawn per question; any beyond are ignored
    size: 0.08                   # radius, when a shape sets none
    color: white                 # when a shape sets none
    default_ori:                 # degrees, when a shape sets no `ori`
      square: 45                 # PsychoPy polygons point up; turn the square flat
    edges:                       # the shape kinds a question may use
      triangle: 3
      square: 4
      diamond: 4
      pentagon: 5
      hexagon: 6
      circle: 64

scanner:
  tr: ~                          # required, seconds
  trigger_key: ~                 # required
  wait_for_triggers: ~           # required: dummy volumes; t=0 is the LAST of these pulses
  log_triggers: true             # every pulse is written to the database
  timestamp_tolerance: 1.0       # s; use the key's hardware timestamp only when this close to when it was seen

run:
  # What is on screen before the first trial and after the last. Same fields as
  # a trial phase: `show` is blank or any screen, `dur` a number or a jittered
  # [lo, hi]. A bare number (`lead_in: 12.0`) sets only the duration.
  lead_in:  {name: lead_in,  show: fixation, dur: 12.0}
  lead_out: {name: lead_out, show: fixation, dur: 12.0}
  n_blocks: ~                    # required
  trials_per_block: ~            # required
  label_balance_pct: 50          # share of each condition's trials whose answer is responses.labels[0]

trial:
  phases: ~                      # required: [{name, show, dur}, ...]
  round_jitter_to_tr: false      # uniform / exponential only; geometric is always whole TRs
  jitter: uniform                # uniform | exponential | geometric, for every [lo, hi] phase
  jitter_p: 0.5                  # geometric: chance the event comes on the next TR (a phase can set `p:`)
  exponential_scale: 0.35        # exponential: mean length above lo, as a share of hi - lo (a phase can set `scale:`)

conditions: ~                    # required; replaced as a whole, never merged with this file

condition_defaults:              # filled into every condition that does not set its own
  show_question: true
  response: answer               # answer | opposite | none | constant (`ready` is read as constant)
  word: ready                    # what `constant` trials repeat
  cue_from_response: false       # the cue shows the token itself (cue-only trials)

responses:
  labels: ["yes", "no"]          # the two answers in the bank; `opposite` swaps them. Quote them:
                                 # bare yes / no are booleans in YAML
  silent_label: SILENT           # how a `none` trial's token reads in the console and the demo

messages:
  waiting: "Waiting for the scanner…\n\n{seen} / {total} pulses"   # {seen}, {total}
  paused:                        # over the held screen during a --debug pause
    text: "paused - {keys} to resume"                               # {keys}
    height: 0.036
    pos: [0, -0.42]

keys:
  quit: ["escape"]
  advance: ["space"]
  pause: ["space"]               # --debug only; works once the scan has started

pilot:
  blocks: 2                      # --pilot shortens the run to this many blocks
  auto_advance: 1.0              # --auto: seconds each pre-scan screen stays up

console:                         # operator readout in the terminal
  refresh_hz: 10                 # live redraw rate; 0 for one plain line per trial
  colour: true

instructions: |
  When the answer cue appears, silently repeat the correct answer - yes or no -
  throughout the entire three-second window at a steady, comfortable cadence.

  Keep your jaw, tongue, and lips still.
  When the cue disappears, stop repeating the word and return to fixation.

  Press SPACE when you are ready.
